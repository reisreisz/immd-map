<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Immigration HQ Wayfinder</title>
  
  <!-- Leaflet CSS (Free Open-Source Map Library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100dvh; width: 100%; overflow: hidden; background: #f4f4f4; }
    
    /* Full-screen Map */
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Top Header Banner */
    .header {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
      padding: 12px 16px; border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .header h1 { font-size: 16px; font-weight: 700; color: #1a2b4c; }
    .header p { font-size: 12px; color: #555; margin-top: 2px; }

    /* Bottom UX Control Panel (EasyLeave Style) */
    .bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
    }

    /* Category Filter Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 10px 8px; border: 1.5px solid #e0e4ec; border-radius: 10px;
      background: #f8f9fb; color: #333; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: #1a2b4c; color: #fff; border-color: #1a2b4c; }

    /* Route Option Cards */
    .options-list { display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; }
    .route-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-radius: 12px; border: 1.5px solid #eee;
      background: #fff; cursor: pointer; text-align: left;
    }
    .route-card.selected { border-color: #0066cc; background: #f0f7ff; }
    .route-title { font-size: 14px; font-weight: 600; color: #111; }
    .route-sub { font-size: 12px; color: #666; margin-top: 2px; }
    .route-badge {
      background: #e6f0fa; color: #0066cc; font-size: 12px; font-weight: 700;
      padding: 4px 8px; border-radius: 8px; white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Immigration Headquarters (TKO)</h1>
    <p>61 Po Yap Road, Tseung Kwan O • Select transport below</p>
  </div>

  <div id="map"></div>

  <div class="bottom-panel">
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCategory('mtr', this)">🚇 MTR</button>
      <button class="tab-btn" onclick="filterCategory('bus', this)">🚌 Bus</button>
      <button class="tab-btn" onclick="filterCategory('parking', this)">🅿️ Parking</button>
    </div>
    <div id="options-container" class="options-list"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Destination Coordinate: Immigration HQ (61 Po Yap Road)
    const IMMD_HQ = [22.3075, 114.2575];

    // 2. Initialize Map centered on Tseung Kwan O
    const map = L.map('map', { zoomControl: false }).setView([22.3078, 114.2585], 16);

    // Load Free OpenStreetMap Tiles (Carto Voyager style for clean mobile readability)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Destination Pin
    const hqMarker = L.marker(IMMD_HQ).addTo(map)
      .bindPopup("<b>Immigration Headquarters</b><br>61 Po Yap Road").openPopup();

    // 3. Pre-defined Transport Nodes & Exact Walking Waypoints
    const transportData = {
      mtr: [
        {
          id: 'mtr-tko',
          name: 'Tseung Kwan O Station (Exit B1)',
          time: '5 min walk',
          desc: 'Via PopCorn & Park Central Footbridge',
          path: [
            [22.3077, 114.2600], // TKO Station Exit B
            [22.3072, 114.2592], // Footbridge link
            [22.3073, 114.2581], // Po Yap Rd crossing
            IMMD_HQ
          ]
        },
        {
          id: 'mtr-tkl',
          name: 'Tiu Keng Leng Station (Exit A)',
          time: '12 min walk',
          desc: 'Walk east along Po Yap Road',
          path: [
            [22.3046, 114.2528], // TKL Station
            [22.3065, 114.2555], // Po Yap Rd West
            IMMD_HQ
          ]
        }
      ],
      bus: [
        {
          id: 'bus-poyap',
          name: 'Po Yap Road (Outside Park Central)',
          time: '2 min walk',
          desc: 'Routes: 793, 795X, 796X, 798, E22A',
          path: [
            [22.3071, 114.2579], // Bus Stop
            IMMD_HQ
          ]
        },
        {
          id: 'bus-tongyin',
          name: 'Tong Yin Street Stop',
          time: '4 min walk',
          desc: 'Routes: 290X, 96, 114B',
          path: [
            [22.3088, 114.2588], // Tong Yin St
            [22.3081, 114.2578],
            IMMD_HQ
          ]
        }
      ],
      parking: [
        {
          id: 'park-central',
          name: 'Park Central Car Park',
          time: '3 min walk',
          desc: 'Entrance via Tong Tak Street',
          path: [
            [22.3066, 114.2585], // Park Central Car Park
            [22.3072, 114.2579],
            IMMD_HQ
          ]
        },
        {
          id: 'park-popcorn',
          name: 'PopCorn Car Park',
          time: '5 min walk',
          desc: 'Use 1/F pedestrian footbridge to Po Yap Rd',
          path: [
            [22.3081, 114.2602], // PopCorn
            [22.3075, 114.2590],
            IMMD_HQ
          ]
        }
      ]
    };

    let currentLine = null;
    let startMarker = null;

    // 4. Render Transport Options
    function filterCategory(category, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      transportData[category].forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'route-card';
        card.innerHTML = `
          <div>
            <div class="route-title">${item.name}</div>
            <div class="route-sub">${item.desc}</div>
          </div>
          <div class="route-badge">${item.time}</div>
        `;
        card.onclick = () => selectRoute(item, card);
        container.appendChild(card);

        // Auto-select first option
        if (index === 0) selectRoute(item, card);
      });
    }

    // 5. Draw Route on Map
    function selectRoute(item, cardElement) {
      document.querySelectorAll('.route-card').forEach(c => c.classList.remove('selected'));
      cardElement.classList.add('selected');

      // Remove old route/marker
      if (currentLine) map.removeLayer(currentLine);
      if (startMarker) map.removeLayer(startMarker);

      // Draw animated dashed polyline
      currentLine = L.polyline(item.path, {
        color: '#0066cc',
        weight: 6,
        opacity: 0.85,
        dashArray: '10, 10'
      }).addTo(map);

      // Add starting point pin
      startMarker = L.circleMarker(item.path[0], {
        radius: 8, fillColor: '#ff5722', color: '#fff', weight: 2, fillOpacity: 1
      }).addTo(map).bindPopup(`<b>Start:</b> ${item.name}`).openPopup();

      // Zoom map smoothly to fit both start and destination
      map.fitBounds(currentLine.getBounds(), { padding: [70, 70] });
    }

    // Initialize default view
    filterCategory('mtr', document.querySelector('.tab-btn'));
  </script>
</body>
</html>
